name: Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and Rust targets
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Resolve and check Dart
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MATRIXPRESS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # Fail before building if CI cannot update previously installed APKs.
          keytool -list -v -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android |
            grep -F 'SHA256: 2E:1C:94:44:6D:3C:1D:33:F8:43:CA:3B:54:25:C6:DF:D1:38:3B:BD:5F:C3:40:8D:0C:30:39:27:87:15:EF:F7'

      - name: Build arm64 release-optimised test APK
        id: build
        run: |
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # Flutter's arm64 split adds 2000 to the requested build number.
          echo "APK_VERSION_CODE=$((BUILD_NUMBER + 2000))" >> "$GITHUB_ENV"
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number="$BUILD_NUMBER"

      - name: Inspect APK
        run: |
          test -s "$APK"
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS" | grep -F 'Signer #1 certificate SHA-256 digest:'
          if ! echo "$CERTS" | grep -Fq 'Signer #1 certificate SHA-256 digest: 2e1c94446d3c1d33f843ca3b5425c6dfd1383bbd5fc3408d0c3039278715eff7'; then
            echo 'APK signing certificate does not match the previously installed preview.' >&2
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep '^package:'
          if ! echo "$BADGING" | grep -Fq "versionCode='$APK_VERSION_CODE'"; then
            echo "APK version code does not match expected $APK_VERSION_CODE." >&2
            exit 1
          fi
          LIBRARIES=$(unzip -Z1 "$APK" | grep '^lib/arm64-v8a/')
          echo "$LIBRARIES"
          if ! echo "$LIBRARIES" | grep -Fxq 'lib/arm64-v8a/libvodozemac_bindings_dart.so'; then
            echo 'Encrypted Matrix native library is absent from the arm64 APK.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: matrixpress-arm64-${{ github.sha }}
          path: ${{ env.APK }}
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Publish a per-commit test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_SHA:0:12}"
          ASSET="build/matrixpress-${TAG}-arm64.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun of the same commit must not silently replace a published APK.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              grep -Fx "matrixpress-${TAG}-arm64.apk"
            echo "Existing release $TAG is unchanged."
          else
            cp "$APK" "$ASSET"
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "MatriXpress $TAG" \
              --notes "Personal Android test build from commit $GITHUB_SHA (APK version code $APK_VERSION_CODE). Signed with the existing debug key so it can update earlier MatriXpress previews. This is not a production-signed or live two-device E2EE-validated release."
          fi
