name: parallax
description: "Parallax — a vivid, focused Matrix messenger for Android, iPhone, iPad and Mac."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+25

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  matrix: ^14.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  flutter_vodozemac: ^0.8.1
  vodozemac: ^0.8.0
  path: ^1.9.1
  # 2.3.x bundles libdartjni.so; retain the last pre-JNI Android implementation.
  path_provider_android: 2.2.23
  image_picker: ^1.2.1
  # 2.5.x JNI registrar crashes at getAll on the Android 15 emulator.
  shared_preferences_android: 2.4.28
  crypto: ^3.0.7
  http: ^1.6.0
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  video_player: ^2.11.1
  audioplayers: ^6.7.1
  record: ^7.1.1
  flutter_web_auth_2: 6.0.0-alpha.8
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.3
  html: ^0.15.7
  emoji_picker_flutter: ^4.5.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  # iOS/macOS WKWebView implementation (Element Call inline media playback).
  webview_flutter_wkwebview: ^3.26.2
  geolocator: ^14.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  image: ^4.12.0
  unifiedpush: ^6.1.0
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  cryptography: ^2.9.0
  # Document previews: Markdown, and the XML inside .docx/.xlsx/.pptx files.
  markdown: ^7.3.1
  xml: ^7.0.1
  # Desktop ports (Windows/macOS). sqflite has no Windows or macOS
  # implementation: the SDK database runs on sqlite3 via FFI there
  # (sqlite3_flutter_libs bundles the DLL/dylib). iOS/Android keep sqflite's
  # native implementation.
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.42
  # Windows video playback (Media Foundation) behind the video_player API.
  video_player_win: ^3.2.2
  # WebView2 host for the Element Call widget on Windows.
  webview_windows: ^0.4.0
  # PDFium renderer for PDF previews on Windows/iOS/macOS (Android uses
  # PdfRenderer).
  pdfx: ^2.9.2
  # Custom blended title bar on desktop (hidden native caption, system drag).
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks of native code (integration_test/).
  integration_test:
    sdk: flutter
  # Stands in for the video plugin in tests (test/media_video_rotation_test.dart).
  video_player_platform_interface: ^6.9.0
  # MSIX packaging for the Microsoft Store / sideloading (windows-port.md).
  msix: ^3.16.8

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # Licences of the message fonts, registered on the app's licence page.
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    # Message fonts (lib/features/message_fonts/), SIL Open Font License 1.1,
    # static regular weights from https://github.com/google/fonts (ofl/).
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: IndieFlower
      fonts:
        - asset: assets/fonts/IndieFlower-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/ComicNeue-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf

# MSIX package for the Microsoft Store / sideloading. Build on Windows after
# `flutter build windows --release`:
#   dart run msix:create            (signed MSIX for sideloading)
#   dart run msix:create --store    (unsigned .msixupload for Partner Center)
# Before a real Store submission: reserve the app name in Partner Center and
# set identity_name/publisher to the reserved values (publisher must be the
# account's "CN=<PublisherID>" from Partner Center → App identity).
msix_config:
  display_name: Parallax
  publisher_display_name: Sam Russell
  identity_name: net.samrussell.Parallax
  publisher: CN=Sam Russell
  msix_version: 1.2.0.0
  logo_path: assets/parallax_mark_cutout.png
  capabilities: internetClient, microphone, webcam
  protocol_activation: matrix
  languages: en-us
  store: false
  sign_msix: false
  install_certificate: false
  output_path: build/windows/msix
  output_name: Parallax-windows-x64

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  window_manager:
    path: packages/window_manager
